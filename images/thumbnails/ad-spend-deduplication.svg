<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#11001c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg5)"/>
  <!-- Duplicate records -->
  <rect x="100" y="140" width="250" height="30" rx="4" fill="#e74c3c" opacity="0.8"/>
  <rect x="100" y="175" width="250" height="30" rx="4" fill="#e74c3c" opacity="0.6"/>
  <rect x="100" y="210" width="250" height="30" rx="4" fill="#e74c3c" opacity="0.4"/>
  <text x="225" y="160" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">record_id: A | spend: duplicated</text>
  <text x="225" y="195" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">record_id: A | spend: duplicated</text>
  <text x="225" y="230" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">record_id: A | spend: duplicated</text>
  <text x="225" y="270" text-anchor="middle" fill="#e74c3c" font-size="13" font-family="sans-serif" font-weight="bold">INFLATED METRICS</text>
  <!-- Arrow -->
  <text x="400" y="200" fill="#a29bfe" font-size="40">&#x2192;</text>
  <!-- Deduplicated -->
  <rect x="470" y="175" width="250" height="30" rx="4" fill="#2ecc71" opacity="0.8"/>
  <text x="595" y="195" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">record_id: A | spend: corrected</text>
  <text x="595" y="230" text-anchor="middle" fill="#2ecc71" font-size="13" font-family="sans-serif" font-weight="bold">DEDUPLICATED</text>
  <!-- SQL window function -->
  <rect x="200" y="320" width="400" height="60" rx="8" fill="#1e1e3f" stroke="#a29bfe" stroke-width="1"/>
  <text x="400" y="345" text-anchor="middle" fill="#a29bfe" font-size="12" font-family="monospace">ROW_NUMBER() OVER (PARTITION BY trk_code</text>
  <text x="400" y="365" text-anchor="middle" fill="#a29bfe" font-size="12" font-family="monospace">ORDER BY creative_id)</text>
  <text x="400" y="55" text-anchor="middle" fill="#ffffff" font-size="22" font-family="sans-serif" font-weight="bold">Ad Spend Deduplication</text>
  <text x="400" y="85" text-anchor="middle" fill="#a29bfe" font-size="14" font-family="monospace">Data Quality · Window Functions · EDA</text>
</svg>