  <text x="610" y="200" text-anchor="middle" fill="#2ecc71" font-size="16" font-family="sans-serif" font-weight="bold">New DW v2</text>
  <text x="610" y="225" text-anchor="middle" fill="#2ecc71" font-size="12" font-family="monospace">optimized profiles</text>
  <text x="610" y="245" text-anchor="middle" fill="#2ecc71" font-size="11" font-family="monospace">lean runtime</text>
