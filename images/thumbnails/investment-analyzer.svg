<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0c10"/>
      <stop offset="100%" style="stop-color:#1f2833"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Funnel bars -->
  <rect x="120" y="150" width="500" height="40" rx="4" fill="#45a29e" opacity="0.9"/>
  <text x="130" y="175" fill="#0b0c10" font-size="13" font-family="sans-serif" font-weight="bold">AWARENESS</text>
  <text x="600" y="175" fill="#66fcf1" font-size="13" font-family="monospace">$XXM</text>
  <rect x="120" y="200" width="380" height="40" rx="4" fill="#66fcf1" opacity="0.7"/>
  <text x="130" y="225" fill="#0b0c10" font-size="13" font-family="sans-serif" font-weight="bold">CONSIDERATION</text>
  <text x="600" y="225" fill="#66fcf1" font-size="13" font-family="monospace">$XXM</text>
  <rect x="120" y="250" width="260" height="40" rx="4" fill="#c5c6c7" opacity="0.6"/>
  <text x="130" y="275" fill="#0b0c10" font-size="13" font-family="sans-serif" font-weight="bold">CONVERSION</text>
  <text x="600" y="275" fill="#66fcf1" font-size="13" font-family="monospace">$XXM</text>
